<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Excavator Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 900px;
            height: 800px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(-25, 0) scale(1.5)">
        
        <!-- Uneven ground -->
       <path d="M 0,74 Q 20,73 40,74.5 T 60,74 Q 62,71 65,68 Q 82,67.5 100,68 L 100,102 L 0,102 Z" fill="#b8956a" stroke="black" stroke-width="0.2"/>
        
        

       <g transform="rotate(4, 54, 80)">
            <polygon points="39,62 54,62 39,70"  fill="#FFDE21"/>
            <polygon points="54,55 62,60 39,70"  fill="#FFDE21"/>
            <rect x="24" y="55" width="30" height="6" fill="#FFDE21" />
            <rect x="24" y="55" width="15" height="15" fill="#FFDE21" />
            <rect x="39" y="55" width="10" height="10" fill="#FFDE21" />
       </g>
        

        
        

        <!-- first tire -->
        <circle cx="28" cy="70" r="6.75" fill="#1A1B1C" stroke="black" stroke-width="0.01" />
        <circle cx="28" cy="70" r="6.75" fill="none" stroke="#1A1B1C" stroke-width="0.6" stroke-dasharray="1.2 1.2" />
        <circle cx="28" cy="70" r="2.75" fill="#FFDE21" stroke="#DFBE21" stroke-width="0.2" />

        <!-- second tire -->
        <circle cx="50" cy="71" r="6.75" fill="#1A1B1C" stroke="black" stroke-width="0.01" />
        <circle cx="50" cy="71" r="6.75" fill="none" stroke="#1A1B1C" stroke-width="0.6" stroke-dasharray="1.2 1.2" />
        <circle cx="50" cy="71" r="2.75" fill="#FFDE21" stroke="#DFBE21" stroke-width="0.2" />

       
        <rect x="19.75" y="63.25" width="9" height="5.25" fill="#FFDE21" stroke="black" stroke-width="0.2"/>
       <rect x="18.25" y="64" width="5.25" height="4" fill="#3a3a3a" stroke="black" stroke-width="0.15"/>
            <line x1="19.5" y1="65" x2="19.5" y2="67.5" stroke="#666" stroke-width="0.3"/>
            <line x1="21" y1="65" x2="21" y2="67.5" stroke="#666" stroke-width="0.3"/>
            <line x1="22.5" y1="65" x2="22.5" y2="67.5" stroke="#666" stroke-width="0.3"/>

    </g>
</svg>
<p>Excavator Animation</p>
<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(-25, 0) scale(1.5)">
        <g id="background-machine" transform="translate(0, 0)">
            <rect x="101.5" y="76" width="2.25" height="4" fill="#FFDE21" stroke="black" stroke-width="0.125"/>
            <rect x="100.5" y="79" width="4.25" height="3.25" fill="#FFDE21" stroke="black" stroke-width="0.0625" />
            <rect x="100" y="80" width="1.5" height="3" fill="black" />
            <rect x="104" y="80" width="1.5" height="3" fill="black" />
            <animateTransform 
                attributeName="transform"
                type="translate"
                from="0 0"
                to="-302 0"
                dur="30.2s"
                repeatCount="indefinite" />
        </g>
        <rect x="0" y="82" width="100" height="20" fill="#836539" stroke="black" stroke-width="0.125"/>
        <rect x="45" y="69" width="17" height="5" transform="rotate(-50, 45, 69)" fill="#FFDE21" stroke="black" stroke-width="0.125"/>
        <ellipse cx="61" cy="58" rx="3" ry="5" fill="#836539" transform="rotate(-40, 61, 58)" />
        <polygon points="54,52 65,63 56,61" stroke="black" fill="#FFDE21" stroke-width="0.35"/>
        <rect x="30" y="58" width="12" height="10" fill="lightgray" fill-opacity="0.3" stroke="black" stroke-width="1.2"/>
        <rect x="25" y="68" width="26" height="8" fill="#FFDE21" stroke="black" stroke-width="0.125"/>
        <ellipse cx="42" cy="80" rx="19" ry="6" fill="#BFAA11" stroke="black" stroke-width="1.25" />
        <circle cx="30" cy="80" r="5" fill="gray" stroke="black" stroke-width="0.5" />
        <circle cx="42" cy="80" r="5" fill="gray" stroke="black" stroke-width="0.5" />
        <circle cx="54" cy="80" r="5" fill="gray" stroke="black" stroke-width="0.5" />
        <g transform="rotate(0, 54, 80)">
            <line x1="54" y1="75.5" x2="54" y2="78.5" stroke="black" stroke-width="0.6" />
            <line x1="54" y1="81.5" x2="54" y2="84.5" stroke="black" stroke-width="0.6" />
            <animateTransform attributeName="transform" type="rotate" from="0 54 80" to="360 54 80" dur="2s" repeatCount="indefinite" />
        </g>
        <g transform="rotate(0, 42, 80)">
            <line x1="42" y1="75.5" x2="42" y2="78.5" stroke="black" stroke-width="0.6" />
            <line x1="42" y1="81.5" x2="42" y2="84.5" stroke="black" stroke-width="0.6" />
            <animateTransform attributeName="transform" type="rotate" from="0 42 80" to="360 42 80" dur="2s" repeatCount="indefinite" />
        </g>
        <g transform="rotate(0, 30, 80)">
            <line x1="30" y1="75.5" x2="30" y2="78.5" stroke="black" stroke-width="0.6" />
            <line x1="30" y1="81.5" x2="30" y2="84.5" stroke="black" stroke-width="0.6" />
            <animateTransform attributeName="transform" type="rotate" from="0 30 80" to="360 30 80" dur="2s" repeatCount="indefinite" />
        </g>
        <g id="stone" transform="translate(0, 0)">
            <ellipse cx="101" cy="98" rx="1" ry="1.5" fill="lightgray" transform="rotate(-40, 101, 98)" stroke="black" stroke-width="0.15"/>
            <ellipse cx="222" cy="86" rx="1.35" ry="1.6" fill="lightgray" transform="rotate(-75, 222, 86)" stroke="black" stroke-width="0.15"/>
            <circle cx="95" cy="94" r="1.5" fill="lightgray" stroke="black" stroke-width="0.15" />
            <circle cx="304" cy="88" r="1.2" fill="lightgray" stroke="black" stroke-width="0.15" />
            <ellipse cx="425" cy="91" rx="2.35" ry="1.6" fill="lightgray" transform="rotate(-10, 425, 84)" stroke="black" stroke-width="0.15" />
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-502 0" dur="10.2s" repeatCount="indefinite" />
        </g>
    </g>
</svg>
`</body>
</html>
