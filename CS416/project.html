<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>416 Project</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

    <div id="main-content">
        <div id="top-content">
            <div id="chart"></div>
            <div id="legend">
                <h2>Legend</h2>
                <ul id="legend-list">
                    <!-- Legend items added here -->
                </ul>
            </div>
        </div>
        <div id="bottom-content">
            <div id="chart-options">
                <form id="options-form">
                    <label for="player-select">Player:</label>
                    <select id="player-select"></select>

                    <label for="season-start">Season Start:</label>
                    <select id="season-start"></select>

                    <label for="season-end">Season End:</label>
                    <select id="season-end"></select>

                    <label for="per-totals">Mode:</label>
                    <select id="per-totals">
                        <option value="totals">Totals</option>
                        <option value="per">Per Game</option>
                    </select>

                    <label for="column-select">Stat:</label>
                    <select id="column-select"></select>

                    <div class="checkbox-group">
                        <input type="checkbox" id="myCheckbox">
                        <label for="myCheckbox">Show Other MVP's</label>
                    </div>

                    <button id="generate-graph" type="submit">Update Chart</button>
                </form>
            </div>
            <div id="MVP-info">
                <div id="slideshow-control">
                    <button class="slide-arrow" id="slide-left" aria-label="Previous">&#8592;</button>
                    <button class="slide-btn">1</button>
                    <button class="slide-btn">2</button>
                    <button class="slide-btn">3</button>
                    <button class="slide-btn">4</button>
                    <button class="slide-btn">5</button>
                    <button class="slide-btn">6</button>
                    <button class="slide-arrow" id="slide-right" aria-label="Next">&#8594;</button>
                </div>
                <div id="slide-content">
                    <p>Slide Content</p>
                </div>
                    
                
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
